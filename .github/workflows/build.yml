name: Build Telegram-Grap

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "APP_ID=${{ secrets.API_ID }}" > local.properties
          echo "APP_HASH=${{ secrets.API_HASH }}" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleRelease

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Grap
          path: "**/*.apk"
